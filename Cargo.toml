[workspace]
members  = ["packages/core", "packages/api"]
resolver = "2"

[workspace.dependencies]
bitcoin      = { version = "0.32", features = ["rand-std"] }
secp256k1    = { version = "0.29", features = ["recovery", "global-context"] }
sha2         = "0.10"
ripemd       = "0.1"
sha1         = "0.10"
hex          = "0.4"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
anyhow       = "1"
